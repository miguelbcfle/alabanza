<style>
:root{
  --ink:#000000;
  --muted:#5c5c5c;
  --paper:#ffffff;
  --blue:#7ed2f0;
  --green:#93c665;
  --purple:#c886b5;
  --yellow:#fcd95e;
  --red:#ea5f65;
  --font:"Open Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font);
  -webkit-font-smoothing:antialiased;
  display:grid;
  grid-template-rows:1fr auto;
  min-height:100%;
}

main{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px 20px 8px;
  gap:22px;
  text-align:center;
}

/* Logo stage */
.stage{
  position:relative;
  width:min(100%, 560px);
  aspect-ratio:1400/703;
}
.navidad .stage{ width:min(100%, 520px); aspect-ratio:1400/964; }
.stage{perspective:1400px}
.card{
  position:absolute; inset:0;
  transform-style:preserve-3d;
  transition:transform 1.5s cubic-bezier(.34,1.4,.5,1);
  transition-timing-function:linear(0.0, 0.049, 0.167, 0.322, 0.485, 0.64, 0.775, 0.884, 0.967, 1.025, 1.061, 1.079, 1.084, 1.079, 1.069, 1.056, 1.042, 1.029, 1.018, 1.009, 1.002, 0.998, 0.995, 0.993, 0.993, 0.993, 0.994, 0.995, 0.997, 0.998, 0.999, 0.999, 1.0, 1.0, 1.0, 1.001, 1);
}
.card img{
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:contain;
  -webkit-backface-visibility:hidden; backface-visibility:hidden;
  user-select:none; -webkit-user-drag:none;
}
.card .back{transform:rotateY(180deg)}

/* Intro: paint splashes land, then the figure rises */
.card .splash{opacity:0}
.intro .splash{animation:splash .62s cubic-bezier(.2,1.4,.4,1) forwards}
.intro .ink{
  transition:none;
  opacity:1;
  clip-path:inset(100% 0 0 0);
  animation:rise 1s cubic-bezier(.3,.7,.2,1) .85s forwards;
}
.splash.done{opacity:0 !important; animation:none}
@keyframes splash{
  0%{opacity:0; transform:scale(.35) rotate(-10deg)}
  100%{opacity:1; transform:scale(1) rotate(0)}
}
@keyframes rise{
  to{clip-path:inset(0 0 0 0)}
}

.tagline{
  margin:-6px 0 0;
  font-style:italic;
  font-size:15px;
  line-height:1.5;
  color:var(--muted);
  max-width:30em;
  text-wrap:balance;
}
.tagline span{display:block}
.tagline span:first-child{font-weight:700;color:#3a3a3a}
.navidad .tagline{display:none}
.navidad .live{margin-top:4px}

/* Live label */
.live{
  display:inline-flex; align-items:center; gap:8px;
  font-size:14px; font-weight:600; letter-spacing:.01em;
}
.live .dot{
  width:10px;height:10px;border-radius:50%;
  background:#b9b9b9;
  transition:background .3s;
}
.live .en{font-weight:400;font-style:italic;color:var(--muted)}
[data-state="playing"] .live .dot{background:var(--red);animation:pulse 1.6s ease-out infinite}
[data-state="connecting"] .live .dot,
[data-state="reconnecting"] .live .dot{background:var(--yellow)}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(234,95,101,.55)}
  100%{box-shadow:0 0 0 12px rgba(234,95,101,0)}
}

/* Play button */
.play{
  position:relative;
  width:112px;height:112px;
  border:1px solid #e4e4e4;border-radius:50%;
  background:#fff;
  box-shadow:0 10px 28px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.08);
  cursor:pointer;
  padding:0;
  display:grid; place-items:center;
  transition:transform .15s ease, box-shadow .2s ease;
  -webkit-tap-highlight-color:transparent;
}
.play:hover{box-shadow:0 14px 34px rgba(0,0,0,.13), 0 3px 8px rgba(0,0,0,.08)}
.play:active{transform:scale(.96)}
.play::before{
  content:"";
  position:absolute; inset:-7px;
  border-radius:50%;
  border:2px solid transparent;
  opacity:0;
  transition:opacity .2s;
}
[data-state="connecting"] .play::before,
[data-state="reconnecting"] .play::before{
  opacity:1;
  border-top-color:#000;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.play svg{width:38px;height:38px;fill:#000}
.play .i-play{margin-left:4px}
.play .i-pause,.play .i-load{display:none}
[data-state="playing"] .play .i-play{display:none}
[data-state="playing"] .play .i-pause{display:block}
[data-state="connecting"] .play .i-play,
[data-state="reconnecting"] .play .i-play{display:none}
[data-state="connecting"] .play .i-load,
[data-state="reconnecting"] .play .i-load{display:block}
.play:focus-visible{outline:3px solid #000;outline-offset:6px}

.hint{
  margin:-6px 0 0;
  text-wrap:balance;
  min-height:3em;
  font-size:15px;
  line-height:1.5;
}
.hint span{display:block}
.hint .en{font-style:italic;color:var(--muted)}

/* Volume and share */
.controls{
  display:flex; align-items:center; gap:14px;
  width:min(100%, 320px);
}
.icon-btn{
  flex:none;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  height:40px; min-width:40px; padding:0 10px;
  border:1.5px solid #dcdcdc; border-radius:20px;
  background:#fff; color:var(--ink);
  font:600 14px/1 var(--font);
  cursor:pointer;
}
.icon-btn svg{width:20px;height:20px;fill:currentColor}
.icon-btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.volume{flex:1; display:flex; align-items:center; gap:8px}
.volume[hidden]{display:none}
.controls.no-volume{justify-content:center}

input[type=range]{
  -webkit-appearance:none; appearance:none;
  flex:1; height:28px; background:transparent; margin:0;
  --fill:100%;
}
input[type=range]::-webkit-slider-runnable-track{
  height:4px;border-radius:2px;
  background:linear-gradient(90deg,#000 var(--fill),#e2e2e2 var(--fill));
}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#e2e2e2}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:#000}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:20px;height:20px;border-radius:50%;
  background:#fff; border:1px solid #dcdcdc; margin-top:-8px;
  box-shadow:0 2px 6px rgba(0,0,0,.18);
}
input[type=range]::-moz-range-thumb{
  width:18px;height:18px;border-radius:50%;
  background:#fff; border:1px solid #dcdcdc;
  box-shadow:0 2px 6px rgba(0,0,0,.18);
}
input[type=range]:focus-visible{outline:3px solid #000;outline-offset:2px;border-radius:4px}

footer{
  padding:16px 20px 20px;
  text-align:center;
  font-size:13px;
  line-height:1.7;
  color:var(--muted);
}
footer a{color:var(--ink);text-decoration-color:#bbb;text-underline-offset:3px}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-height:640px){
  main{gap:14px}
  .stage{width:min(100%,420px)}
  .navidad .stage{width:min(100%,340px)}
}

@media (prefers-reduced-motion:reduce){
  .intro .splash,.intro .ink{animation:none;opacity:1;clip-path:none}
  .card{transition:none}
  [data-state="playing"] .live .dot{animation:none}
}
</style>
</head>
<body data-state="idle">

<main>
  <h1 class="sr-only">Alabanza Stereo y Worship Stereo, radio cristiana en vivo</h1>

  <div class="stage" id="stage" aria-hidden="true"></div>

  <p class="tagline">
    <span>Con amor para el Señor, en armonía versículo y canción.</span>
    <span lang="en">With love to the Lord, in harmony scripture and song.</span>
  </p>

  <div class="live"><span class="dot"></span>En vivo <span class="en" lang="en">Live</span></div>

  <button class="play" id="play" type="button" aria-label="Escuchar / Listen">
    <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg>
      <svg class="i-load" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/></svg>
  </button>

  <p class="hint" id="hint" aria-live="polite"></p>

  <div class="controls" id="controls">
    <div class="volume" id="volumeWrap">
      <button class="icon-btn" id="mute" type="button" aria-label="Silenciar / Mute">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path id="muteIcon" d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
      </button>
      <label class="sr-only" for="volume">Volumen / Volume</label>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
    </div>
    <button class="icon-btn" id="share" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16.1c-.8 0-1.5.3-2 .8l-7.1-4.1c.1-.3.1-.5.1-.8s0-.5-.1-.8L16 7.1c.5.5 1.2.8 2 .8a3 3 0 1 0-3-3c0 .3 0 .5.1.8L8 9.8A3 3 0 1 0 8 14.2l7.1 4.1c-.1.2-.1.5-.1.7a3 3 0 1 0 3-2.9z"/></svg>
      <span id="shareLabel">Compartir</span>
    </button>
  </div>
</main>

<footer>
  <a href="mailto:info@alabanzastereo.com">info@alabanzastereo.com</a><br>
  &copy; 2012&ndash;<span id="year">2026</span> Worship Stereo / Alabanza Stereo
</footer>

<audio id="audio" preload="none"></audio>

<script>
(function () {
  "use strict";

  /* ===== Settings you may want to change ===== */
  var STREAM_URL = "https://solid9.streamupsolutions.com/proxy/gnqrzdzo?mp=/;type=mp3";
  var SWITCH_EVERY_MS = 90000;          // 90 seconds between logo flips
  // Christmas logos show from November 20 through January 6 (Dia de Reyes).
  // Preview anytime with ?navidad=1  (or force off with ?navidad=0)
  function isChristmasSeason(d) {
    var m = d.getMonth() + 1, day = d.getDate();
    return (m === 11 && day >= 20) || m === 12 || (m === 1 && day <= 6);
  }
  /* =========================================== */

  var LOGOS = {
    normal:  { a: "img/alabanza.webp",          b: "img/worship.webp",
               alt: ["Alabanza Stereo", "Worship Stereo"], intro: "alabanza",
               splashes: [["blue",11.5,68.7],["green",27.2,66.0],["purple",57.8,69.4],["yellow",74.0,68.6],["red",89.6,68.9]] },
    navidad: { a: "img/alabanza-navidad.webp",  b: "img/worship-navidad.webp",
               alt: ["Alabanza Stereo, Navidad", "Worship Stereo, Christmas"], intro: "alabanza-navidad",
               splashes: [["blue",11.5,52.3],["green",27.3,50.3],["purple",58.6,53.0],["yellow",74.7,52.3],["red",90.3,52.5]] }
  };

  var params = new URLSearchParams(location.search);
  var force = params.get("navidad");
  var christmas = force === "1" ? true : force === "0" ? false : isChristmasSeason(new Date());
  var set = christmas ? LOGOS.navidad : LOGOS.normal;
  if (christmas) document.body.classList.add("navidad");

  document.getElementById("year").textContent = new Date().getFullYear();

  /* ---------- Logo intro and switching ---------- */
  var stage = document.getElementById("stage");
  var card = document.createElement("div");
  card.className = "card";
  stage.appendChild(card);
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var splashEls = set.splashes.map(function (s, i) {
    var img = new Image();
    img.src = "img/" + set.intro + "-" + s[0] + ".webp";
    img.alt = "";
    img.className = "splash";
    img.style.transformOrigin = s[1] + "% " + s[2] + "%";
    img.style.animationDelay = (i * 0.11) + "s";
    card.appendChild(img);
    return img;
  });

  var imgA = new Image(); imgA.src = set.a; imgA.alt = set.alt[0]; imgA.className = "ink";
  var imgB = new Image(); imgB.alt = set.alt[1]; imgB.className = "back";
  card.appendChild(imgA);
  card.appendChild(imgB);

  var turns = 0;
  function switchLogo() {
    if (document.hidden) return;
    turns++;
    card.style.transform = "rotateY(" + (turns * 180) + "deg)";
  }
  function startCycle(firstDelay) {
    imgB.src = set.b; // load the second logo only after the first is showing
    setTimeout(function () {
      switchLogo();
      setInterval(switchLogo, SWITCH_EVERY_MS);
    }, firstDelay);
  }

  function runIntro() {
    if (reduceMotion) {
      splashEls.forEach(function (el) { el.remove(); });
      imgA.classList.remove("ink");
      startCycle(SWITCH_EVERY_MS);
      return;
    }
    stage.classList.add("intro");
    setTimeout(function () {
      stage.classList.remove("intro");
      splashEls.forEach(function (el) { el.remove(); });
      imgA.classList.remove("ink");
      startCycle(SWITCH_EVERY_MS);
    }, 2000);
  }

  // Wait for the intro images so the animation does not play half-loaded
  var toLoad = splashEls.concat([imgA]);
  Promise.all(toLoad.map(function (im) {
    return im.decode ? im.decode().catch(function () {}) : Promise.resolve();
  })).then(runIntro);

  /* ---------- Player ---------- */
  var audio = document.getElementById("audio");
  var playBtn = document.getElementById("play");
  var hint = document.getElementById("hint");

  var TEXT = {
    idle:         ["Toca para escuchar", "Tap to listen"],
    connecting:   ["Conectando...", "Connecting..."],
    playing:      ["Escuchando en vivo", "Listening live"],
    reconnecting: ["Se perdi\u00f3 la se\u00f1al. Reconectando...", "Signal lost. Reconnecting..."],
    failed:       ["La se\u00f1al no responde. Toca para intentar de nuevo.", "The stream is not responding. Tap to try again."]
  };

  var state = "idle";
  var wantPlay = false;
  var retries = 0;
  var retryTimer = null;
  var stallTimer = null;
  var lastTime = 0;

  function setState(s) {
    state = s;
    document.body.setAttribute("data-state", s === "failed" ? "idle" : s);
    var t = TEXT[s];
    hint.innerHTML = "<span>" + t[0] + "</span><span class='en' lang='en'>" + t[1] + "</span>";
    playBtn.setAttribute("aria-label", s === "playing" ? "Pausar / Pause" : "Escuchar / Listen");
    if ("mediaSession" in navigator) {
      navigator.mediaSession.playbackState = s === "playing" ? "playing" : (wantPlay ? "playing" : "paused");
    }
  }

  function connect() {
    clearTimeout(retryTimer);
    setState(retries > 0 ? "reconnecting" : "connecting");
    audio.src = STREAM_URL;
    audio.load();
    var p = audio.play();
    if (p && p.catch) {
      p.catch(function (err) {
        if (err && err.name === "NotAllowedError") { wantPlay = false; setState("idle"); }
        else if (err && err.name !== "AbortError") { scheduleRetry(); }
      });
    }
  }

  function scheduleRetry() {
    if (!wantPlay) return;
    clearTimeout(retryTimer);
    if (retries >= 8) { stopAudio(); setState("failed"); return; }
    var delays = [1000, 2000, 4000, 6000, 10000, 15000, 20000, 30000];
    var wait = delays[Math.min(retries, delays.length - 1)];
    retries++;
    setState("reconnecting");
    retryTimer = setTimeout(connect, wait);
  }

  function stopAudio() {
    clearTimeout(retryTimer);
    clearInterval(stallTimer);
    audio.pause();
    audio.removeAttribute("src");
    audio.load(); // drop the old buffer so the next play is live, not delayed
  }

  function start() {
    wantPlay = true;
    retries = 0;
    connect();
  }

  function stop() {
    wantPlay = false;
    stopAudio();
    setState("idle");
  }

  playBtn.addEventListener("click", function () {
    if (state === "playing" || state === "connecting" || state === "reconnecting") stop();
    else start();
  });

  audio.addEventListener("playing", function () {
    if (!wantPlay) return;
    retries = 0;
    setState("playing");
    clearInterval(stallTimer);
    lastTime = audio.currentTime;
    var still = 0;
    stallTimer = setInterval(function () {
      if (!wantPlay) return;
      if (audio.currentTime === lastTime) { still++; } else { still = 0; lastTime = audio.currentTime; }
      if (still >= 4) { still = 0; clearInterval(stallTimer); scheduleRetry(); } // about 12s frozen
    }, 3000);
  });
  ["error", "ended"].forEach(function (ev) {
    audio.addEventListener(ev, function () { if (wantPlay) scheduleRetry(); });
  });
  audio.addEventListener("pause", function () {
    // Paused by the system (headphones unplugged, call, lock screen)
    if (wantPlay && state === "playing" && !audio.ended) { wantPlay = false; stopAudio(); setState("idle"); }
  });

  // Come back online after a dropped connection
  window.addEventListener("online", function () { if (wantPlay) { retries = 0; connect(); } });

  /* ---------- Lock screen controls ---------- */
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: christmas ? "Alabanza Stereo, Navidad" : "Alabanza Stereo",
      artist: "En vivo / Live",
      album: "Worship Stereo",
      artwork: [
        { src: "icon-192.png", sizes: "192x192", type: "image/png" },
        { src: "icon-512.png", sizes: "512x512", type: "image/png" }
      ]
    });
    var mh = function (a, fn) { try { navigator.mediaSession.setActionHandler(a, fn); } catch (e) {} };
    mh("play", start);
    mh("pause", stop);
    mh("stop", stop);
  }

  /* ---------- Volume (hidden where the phone controls it, like iPhone) ---------- */
  var volume = document.getElementById("volume");
  var volumeWrap = document.getElementById("volumeWrap");
  var muteBtn = document.getElementById("mute");
  var muteIcon = document.getElementById("muteIcon");
  var ICON_ON = "M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z";
  var ICON_OFF = "M4 9v6h4l5 4V5L8 9H4zm12.6 3 2.7-2.7-1.1-1.1-2.7 2.7-2.7-2.7-1.1 1.1 2.7 2.7-2.7 2.7 1.1 1.1 2.7-2.7 2.7 2.7 1.1-1.1z";

  var probe = document.createElement("audio");
  probe.volume = 0.5;
  var canSetVolume = Math.abs(probe.volume - 0.5) < 0.01;

  if (!canSetVolume) {
    volumeWrap.hidden = true;
    document.getElementById("controls").classList.add("no-volume");
  } else {
    var saved = null;
    try { saved = localStorage.getItem("as-volume"); } catch (e) {}
    if (saved !== null && !isNaN(parseFloat(saved))) volume.value = saved;
    audio.volume = parseFloat(volume.value);
    var paintFill = function () {
      var v = audio.muted ? 0 : parseFloat(volume.value);
      volume.style.setProperty("--fill", (v * 100) + "%");
    };
    paintFill();
    var updateMuteIcon = function () {
      var off = audio.muted || audio.volume === 0;
      muteIcon.setAttribute("d", off ? ICON_OFF : ICON_ON);
      muteBtn.setAttribute("aria-label", off ? "Activar sonido / Unmute" : "Silenciar / Mute");
      paintFill();
    };
    volume.addEventListener("input", function () {
      audio.volume = parseFloat(volume.value);
      audio.muted = false;
      try { localStorage.setItem("as-volume", volume.value); } catch (e) {}
      updateMuteIcon();
    });
    muteBtn.addEventListener("click", function () { audio.muted = !audio.muted; updateMuteIcon(); });
    updateMuteIcon();
  }

  /* ---------- Share ---------- */
  var shareBtn = document.getElementById("share");
  var shareLabel = document.getElementById("shareLabel");
  var shareUrl = "https://alabanzastereo.com/";
  shareBtn.addEventListener("click", function () {
    var data = { title: "Alabanza Stereo", text: "Escucha Alabanza Stereo en vivo / Listen live", url: shareUrl };
    if (navigator.share) {
      navigator.share(data).catch(function () {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(shareUrl).then(function () {
        shareLabel.textContent = "Enlace copiado";
        setTimeout(function () { shareLabel.textContent = "Compartir"; }, 2200);
      });
    }
  });

  setState("idle");
})();
</script>
